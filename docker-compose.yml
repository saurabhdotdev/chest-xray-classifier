version: "3.9"

services:
  # ── 1. FastAPI Medical Inference Microservice ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chestai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 2. Streamlit PACS Radiology Workstation ───────────────────────────────
  workstation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chestai_workstation
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
